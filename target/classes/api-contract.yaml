
openapi: 3.0.0

info:
  title: Addition API
  description: API to add two numbers
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /msl/add:
    get:
      summary: Add two numbers

      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: integer
          example: 5

        - name: b
          in: query
          required: true
          schema:
            type: integer
          example: 10

      responses:
        '200':
          description: Addition successful
          content:
            text/plain:
              schema:
                type: string
              example: "15"
